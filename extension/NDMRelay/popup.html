<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="extName">NDM Relay</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="brand" translate="no">
        <span class="wordmark">NDM</span>
        <span class="sub" data-i18n="popupRelay">Relay</span>
      </div>
      <div class="status" id="status" data-state="checking" role="status" aria-live="polite" aria-atomic="true">
        <span class="dot" aria-hidden="true"></span>
        <span class="status-text" id="status-text" data-i18n="popupChecking">正在检查…</span>
      </div>
    </header>

    <section class="page-context" aria-labelledby="page-title">
      <div class="page-eyebrow">
        <span data-i18n="popupCurrentPage">当前页面</span>
        <button type="button" class="refresh" id="refresh-page" data-i18n="popupRefresh">刷新列表</button>
      </div>
      <h1 id="page-title"></h1>
      <div class="page-host" id="page-host"></div>
    </section>

    <main class="discoveries">
    <section class="resource-card" id="media-card" hidden aria-labelledby="media-title">
      <div class="resource-head">
        <div class="card-title" id="media-title" data-i18n="popupMediaChoices">视频与音频</div>
        <div class="resource-total" id="media-total"></div>
      </div>
      <div class="media-list" id="media-list"></div>
      <div class="media-fallback" id="media-fallback" hidden>
        <div class="card-sub" id="media-count-line"></div>
        <button type="button" class="btn btn-accent" id="show-panel" data-i18n="popupShowControls">显示下载选项</button>
      </div>
    </section>

    <section class="card" id="page-resolver-card" hidden>
      <div class="card-main">
        <div class="card-title" data-i18n="popupPageTitle">当前视频页面</div>
        <div class="card-sub" id="page-resolver-feedback" role="status" aria-live="polite" data-i18n="popupPageHint">在 NDM 中解析并选择画质</div>
      </div>
      <button type="button" class="btn btn-accent" id="resolve-page" data-i18n="popupResolvePage">解析当前页</button>
    </section>

    <section class="resource-card" id="resource-card" hidden aria-labelledby="resource-title">
      <div class="resource-head">
        <div class="card-title" id="resource-title" data-i18n="popupResourceTitle">本页文件</div>
        <div class="resource-total" id="resource-total"></div>
      </div>
      <div class="resource-list" id="resource-list"></div>
    </section>

    <section class="discovery-empty" id="discovery-empty" role="status" aria-live="polite" hidden>
      <div class="empty-title" id="empty-title" data-i18n="popupEmptyTitle">还没有发现可下载内容</div>
      <p id="empty-hint" data-i18n="popupEmptyHint">先播放视频或打开文件，再刷新列表。</p>
    </section>
    </main>

    <section class="card row catcher-card">
      <div class="card-main">
        <div class="card-title" data-i18n="popupCatcherTitle">接管浏览器下载</div>
        <div class="card-sub" id="catcher-sub" data-i18n="popupCatcherSub" aria-live="polite">普通下载自动交给 NDM 加速</div>
      </div>
      <button type="button" class="switch" id="catcher" role="switch" aria-checked="true" aria-label="接管浏览器下载" data-i18n-aria-label="popupCatcherTitle" aria-describedby="catcher-sub">
        <span class="knob"></span>
      </button>
    </section>

    <section class="hint" id="offline-hint" hidden>
      <span data-i18n="popupOfflineHint">NDM 应用未在运行。打开应用后,下载会自动接力。</span>
    </section>

    <footer class="foot">
      <div class="foot-row">
        <span class="foot-hint" data-i18n="popupContextHint">右键链接或图片，用 NDM 下载</span>
        <button type="button" class="btn btn-quiet" id="open-app" data-i18n="popupOpenApp">打开 NDM</button>
      </div>
      <div class="foot-note" id="foot-note" data-i18n="popupVersion">NDM Relay</div>
    </footer>
    <script src="site-adapters.js"></script>
    <script src="popup.js"></script>
  </body>
</html>

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/engine-ipc-lifecycle-and-loopback

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run test:relay
      - run: npm run build
      - name: Install renderer QA browser
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Exercise the built workspace UI
        if: runner.os == 'Linux'
        run: node scripts/qa-workspace.mjs
        env:
          NDM_QA_OUTPUT: qa-artifacts/workspace
      - name: Upload renderer QA screenshots and report
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: workspace-renderer-qa
          path: qa-artifacts/workspace
          if-no-files-found: ignore
          retention-days: 7

  native:
    name: Native (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: swift test --package-path native
      - run: swift build --package-path native -c release --product NDMHost

name: Apply verified workspace review
on:
  push:
    branches: [feat/download-workspace-polish]
    paths: [.github/workflows/apply-reviewed-workspace.yml]
permissions:
  contents: write
concurrency:
  group: apply-reviewed-workspace
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'gy-0/NDM-desktop' && github.ref == 'refs/heads/feat/download-workspace-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Apply exact locally validated diff and remove transfer material
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          bits = Path('.github/workspace-patch.1').read_text() + Path('.github/workspace-patch.2').read_text()
          patch = lzma.decompress(base64.b64decode(bits, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '2f85cd3a287d6a6e251d169b441fa3e8eb6fc4936d98757c9a63570cb21f0637'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
          git rm .github/workspace-patch.1 .github/workspace-patch.2 .github/workflows/apply-reviewed-workspace.yml
          test "$(git write-tree)" = "fc8c13bd866ae19d66887e263ca862773a1a9003"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: polish download workspace, guard task actions and add renderer regression QA'
          git push origin HEAD:refs/heads/feat/download-workspace-polish

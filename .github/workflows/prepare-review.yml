name: Prepare review workspace
on:
  push:
    branches: [feat/download-workspace-polish]
    paths: [.github/workflows/prepare-review.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Archive source and installed review dependencies (no credentials)
        run: tar --exclude='./.git' -czf "$RUNNER_TEMP/ndm-review.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: ndm-review-workspace
          path: ${{ runner.temp }}/ndm-review.tar.gz
          retention-days: 1

<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NDM renderer QA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e6e7e9;color:#222;font:13px system-ui,sans-serif}header{padding:12px 18px;background:white;border-bottom:1px solid #ccc}h1{font-size:15px;margin:0 0 10px}form{display:flex;align-items:end;gap:12px;flex-wrap:wrap}label{display:grid;gap:4px;font-size:11px;color:#555}select,input,button{font:inherit;padding:5px 8px;border:1px solid #aaa;border-radius:5px;background:white;color:#222}input[type=number]{width:82px}button{cursor:pointer}main{padding:18px;overflow:auto}iframe{display:block;border:0;border-radius:12px;box-shadow:0 10px 30px #0003;background:#111}details{max-width:1100px;margin-top:16px;padding:12px;background:white;border-radius:8px}summary{cursor:pointer}pre{font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}#note{margin-top:10px;color:#666;font-size:11px}a{color:#3559ac}
</style></head>
<body><header><h1>NDM renderer QA · 真实 React 界面 / 模拟下载引擎</h1>
<form id="controls">
<label>页面<select name="view"><option value="composer">视频下载</option><option value="main">下载列表 / 侧栏</option></select></label>
<label>外观<select name="theme"><option value="dawn">浅色 · 雾昼</option><option value="walnut">深色 · 墨夜</option><option value="noon">纯白 · 白昼</option></select></label>
<label>宽度<input name="width" type="number" value="1280" min="360" max="2560"></label>
<label>高度<input name="height" type="number" value="800" min="400" max="1800"></label>
<label>字幕<select name="subtitles"><option value="none">无字幕</option><option value="available">中英文字幕</option></select></label>
<label>清晰度<select name="formats"><option value="standard">6 项</option><option value="extended">10 项（展开验收）</option></select></label>
<label>解析<select name="probe"><option value="success">成功</option><option value="recover">首次失败，重试恢复</option><option value="fail">持续失败</option><option value="session">需 Chrome 会话</option></select></label>
<label>磁盘<select name="storage"><option value="comfortable">空间充足</option><option value="tight">空间紧张</option><option value="insufficient">空间不足</option></select></label>
<label>任务<select name="tasks"><option value="sample">示例任务</option><option value="empty">空列表</option></select></label>
<button type="submit">应用并重载</button><button id="clear" type="button">清空 QA 草稿</button>
</form>
<div id="note">仅验证 renderer 交互。红绿灯按主进程 x=16 / y=18 模拟；实际 macOS 标题栏需在 Mac 上复验。 <a id="direct" target="_blank">打开独立 App 页面</a></div>
</header><main><iframe id="app" title="NDM App preview"></iframe><details open><summary>可见请求记录与创建结果</summary><pre id="result" aria-live="polite">等待界面初始化…</pre></details></main>
<script type="module">
const form = document.getElementById('controls'), frame = document.getElementById('app'), initial = new URLSearchParams(location.search)
for (const [key, value] of initial) { const field = form.elements.namedItem(key); if (field) field.value = value }
function apply(){
  const query = new URLSearchParams(new FormData(form))
  for(const key of ['title','traffic','url','draft']) if(initial.has(key)) query.set(key,initial.get(key))
  const direct = './app.html?' + query
  frame.style.width = query.get('width') + 'px'; frame.style.height = query.get('height') + 'px'
  frame.src = direct; document.getElementById('direct').href = direct
  history.replaceState(null,'','?' + query)
  document.getElementById('result').textContent = '等待界面初始化…'
}
form.addEventListener('submit', event => {event.preventDefault();apply()})
document.getElementById('clear').addEventListener('click',()=>{localStorage.removeItem('ndm.qa.composer-draft');apply()})
window.addEventListener('message', event => {
  if(event.source !== frame.contentWindow || event.origin !== location.origin || event.data?.type !== 'ndm-qa-log') return
  document.getElementById('result').textContent = JSON.stringify(event.data.state,null,2)
})
apply()
</script></body></html>
